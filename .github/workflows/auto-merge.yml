name: Auto-merge new versions

# Every push to a claude/** branch is opened as a PR into main, squash-merged,
# and then the Publish workflow is dispatched (merges made with GITHUB_TOKEN
# do not trigger push workflows by themselves).
on:
  push:
    branches: ['claude/**']

permissions:
  contents: write
  pull-requests: write
  actions: write

jobs:
  merge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const head = context.ref.replace('refs/heads/', '');
            const base = context.payload.repository.default_branch;
            let { data: prs } = await github.rest.pulls.list({ owner, repo, head: `${owner}:${head}`, base, state: 'open' });
            let pr = prs[0];
            if (!pr) {
              const msg = context.payload.head_commit?.message?.split('\n')[0] || `Update from ${head}`;
              pr = (await github.rest.pulls.create({ owner, repo, head, base, title: msg, body: 'Automated version merge.' })).data;
            }
            await github.rest.pulls.merge({ owner, repo, pull_number: pr.number, merge_method: 'squash' });
            await github.rest.actions.createWorkflowDispatch({ owner, repo, workflow_id: 'pages.yml', ref: base });
