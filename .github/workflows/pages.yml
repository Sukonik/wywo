name: Publish

# Deploys the static site to GitHub Pages on every push to main
# (and when auto-merge.yml dispatches it after merging a version).
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Assemble site and stamp build
        run: |
          mkdir _site
          cp -r index.html bluebird-ui src assets favicon.ico favicon.svg apple-touch-icon.png site.webmanifest _site/
          sed -i "s|<span id=\"build\">dev</span>|<span id=\"build\">${GITHUB_SHA::7}</span>|" _site/index.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
