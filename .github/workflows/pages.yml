name: Publish

# Deploys the static site to GitHub Pages on every push to main
# (and when auto-merge.yml dispatches it after merging a version).
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 6
      # GitHub Pages refuses a new deploy while an older one is stuck "in progress".
      # Cancel any stuck deployment from recent commits first (harmless if none).
      - name: Cancel stuck Pages deployments
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for sha in $(git rev-list --skip=1 -n 5 HEAD); do
            if gh api -X POST "repos/${{ github.repository }}/pages/deployments/$sha/cancel" >/dev/null 2>&1; then echo "cancelled stuck deployment $sha"; fi
          done
          sleep 5
      - name: Assemble site and stamp build
        run: |
          mkdir _site
          cp -r index.html bluebird-ui src assets favicon.ico favicon-16x16.png favicon-32x32.png apple-touch-icon.png android-chrome-192x192.png android-chrome-512x512.png site.webmanifest _site/
          sed -i "s|<span id=\"build\">dev</span>|<span id=\"build\">${GITHUB_SHA::7}</span>|" _site/index.html
          # cache-bust: phones keep old CSS/JS otherwise (users saw a stale version)
          sed -i -E "s#(src|href)=\"((src|bluebird-ui)/[^\"?]+\.(js|css))\"#\1=\"\2?v=${GITHUB_SHA::7}\"#g" _site/index.html
          grep -c "?v=${GITHUB_SHA::7}" _site/index.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
        with:
          timeout: 1800000   # Pages can be slow; the action's default (10 min) timed out twice
          error_count: 20
