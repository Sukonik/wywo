name: Tests

# Runs the automated checks (Bird Seed, Bird Watch, Quick type) on every push and pull request.
# Live-internet checks are opt-in: `npm run test:live`.
on:
  push:
    branches: [main, 'claude/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
