<!doctype html>
<html lang="en" data-theme="bluebird" data-size="l">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>WYWO — While You Were Out</title>
  <meta name="description" content="Jot down a call in plain words. Get a clean, readable, printable callback note.">
  <link rel="icon" href="assets/logo.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@600;700&display=swap">
  <script>
    // Apply saved theme / size before paint to avoid a flash.
    try {
      var s = JSON.parse(localStorage.getItem('wywo.ui') || '{}');
      if (s.theme) document.documentElement.dataset.theme = s.theme;
      if (s.mode) document.documentElement.dataset.mode = s.mode;
      if (s.size) document.documentElement.dataset.size = s.size;
    } catch (e) {}
  </script>
  <link rel="stylesheet" href="bluebird-ui/bluebird.css">
  <link rel="stylesheet" href="src/app.css">
</head>
<body>
<header class="topbar">
  <div class="bb-container topbar__in">
    <a class="brand" href="./" aria-label="WYWO home">
      <span class="brand__logo"><img src="assets/logo.svg" alt="" width="22" height="22"></span>
      <span class="brand__name">WYWO</span>
    </a>
    <span class="topbar__sp"></span>
    <button class="bb-btn bb-btn--ghost" type="button" id="notesBtn" aria-controls="drawer" aria-expanded="false">🗂 Notes <span class="bb-badge" id="savedCount">0</span></button>
    <div class="pop-wrap">
      <button class="bb-btn bb-btn--ghost" type="button" id="themeBtn" aria-expanded="false" aria-controls="themePop">🐦 <span id="themeLabel">Bluebird</span></button>
      <div class="pop" id="themePop" hidden><div id="swatches" role="group" aria-label="Theme"></div></div>
    </div>
    <button class="bb-btn bb-btn--ghost bb-btn--icon" id="modeBtn" type="button" aria-label="Toggle dark mode" title="Light / dark">🌗</button>
  </div>
</header>

<main class="bb-container layout">
  <!-- ================= EDITOR ================= -->
  <form id="form" class="editor" autocomplete="off" novalidate>
    <section class="quick">
      <textarea id="quick" rows="3" aria-label="Jot it down" placeholder="Jot the call down in your own words…&#10;e.g. Cian O'Brien, OCS Development Group, 646-331-2205. Transferred by the Building Department, asking about zoning, permits and mercantile license."></textarea>
      <div class="quick__bar">
        <button class="bb-btn bb-btn--primary" type="button" id="quickBtn">✨ Organize</button>
        <span class="bb-hint">⌘/Ctrl + Enter · anything we can’t sort goes into the note</span>
        <span class="quick__sp"></span>
        <button class="bb-btn bb-btn--sm bb-btn--ghost" type="button" id="exampleBtn">Example</button>
        <button class="bb-btn bb-btn--sm bb-btn--ghost" type="button" id="clearBtn">New</button>
      </div>
    </section>

    <section class="fields">
      <label class="urgent"><input type="checkbox" name="urgent"> <span>🚨 Urgent</span></label>

      <label class="f f--big"><span>Caller</span><input name="caller" placeholder="Name"></label>
      <div class="row">
        <label class="f"><span>Company</span><input name="company" placeholder="Company or agency"></label>
        <label class="f"><span>Phone</span><input name="phone" type="tel" inputmode="tel" placeholder="000-000-0000"></label>
      </div>

      <label class="f"><span>Reason for call</span><textarea name="reason" rows="2" placeholder="Why they called"></textarea></label>
      <label class="f"><span>Topics <em>one per line</em></span><textarea name="topics" rows="3" placeholder="Zoning&#10;Permits"></textarea></label>
      <label class="f"><span>Requested action</span><textarea name="action" rows="2" placeholder="What should happen next"></textarea></label>
      <label class="f"><span>Additional notes <em>everything else</em></span><textarea name="extra" rows="2" placeholder="Anything else worth knowing"></textarea></label>

      <div class="refs-head"><span class="lbl">References</span><button class="bb-btn bb-btn--sm" type="button" id="addRef">＋ Add</button></div>
      <div id="refs" class="refs"></div>

      <details class="more">
        <summary>More details <em>for · date · time · call type · signed</em></summary>
        <div class="more__in">
          <div class="row">
            <label class="f"><span>For</span><input name="forWho" placeholder="Who is this for?"></label>
            <label class="f"><span>Taken by</span><input name="signed" placeholder="Your name"></label>
          </div>
          <div class="row">
            <label class="f"><span>Date</span><input type="date" name="date"></label>
            <label class="f"><span>Time</span><input type="time" name="time"></label>
          </div>
          <label class="f"><span>Email / cell / fax</span><input name="alt" placeholder="Optional"></label>
          <div class="f"><span>Call type</span><div class="chips" id="methods"></div></div>
        </div>
      </details>

      <details class="more" id="lookupBox">
        <summary>🔎 Look up missing details <em>one or two clicks</em></summary>
        <div class="more__in">
          <label class="f"><span>City / municipality <em>for agency lookups</em></span><input id="city" placeholder="Long Beach, NY"></label>
          <div class="chips" id="lookups"></div>
          <p class="bb-hint" id="lookupMsg"></p>
        </div>
      </details>
    </section>
  </form>

  <!-- ================= PREVIEW ================= -->
  <section class="preview" aria-label="Preview">
    <div class="pv-bar">
      <div class="seg" role="tablist" id="tabs">
        <button class="seg__b" role="tab" aria-selected="true" data-view="modern">Note</button>
        <button class="seg__b" role="tab" aria-selected="false" data-view="classic">Vintage</button>
        <button class="seg__b" role="tab" aria-selected="false" data-view="text">Text</button>
        <button class="seg__b" role="tab" aria-selected="false" data-view="markdown">Markdown</button>
      </div>
      <span class="pv-sp"></span>
      <select class="mini" id="sizeSel" aria-label="Text size"><option value="m">Text: Standard</option><option value="l">Text: Large</option><option value="xl">Text: Extra large</option></select>
    </div>
    <div class="pv-pane" id="pane" role="tabpanel"></div>
    <div class="pv-actions">
      <button class="bb-btn bb-btn--primary" type="button" id="printBtn">🖨️ Export PDF / Print</button>
      <select class="mini" id="printLayout" aria-label="Print layout"><option value="full">Full page</option><option value="pad">Pad slip 4¼×5½</option><option value="two">2 per sheet</option></select>
      <span class="pv-sp"></span>
      <button class="bb-btn" type="button" id="copyBtn">Copy</button>
      <button class="bb-btn" type="button" id="downloadBtn">Download</button>
      <button class="bb-btn" type="button" id="saveBtn">💾 Save</button>
    </div>
  </section>
</main>

<!-- Saved notes drawer -->
<aside class="drawer" id="drawer" aria-label="Saved notes" hidden>
  <div class="drawer__head"><h2>Saved notes</h2><button class="bb-btn bb-btn--ghost bb-btn--icon" type="button" id="drawerClose" aria-label="Close">✕</button></div>
  <div class="saved" id="saved"></div>
</aside>
<div class="scrim" id="scrim" hidden></div>

<footer>WYWO · Built with <strong>Bluebird UI</strong> · 🔒 Notes stay in your browser · v0.2.0 · build <span id="build">dev</span></footer>
<div class="bb-toast" id="toast" role="status" aria-live="polite"></div>
<div id="printArea" aria-hidden="true"></div>

<script src="src/app.js"></script>
</body>
</html>
